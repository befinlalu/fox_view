<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Slider</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="slides-dots">
    <div class="slider-container">
        <div class="slider">
          <img src="asset/computer.png" alt="Slide 1" class="slide">
          <img src="asset/Home Background.jpg" alt="Slide 2" class="slide">
          <img src="asset/phone.png" alt="Slide 3" class="slide">
        </div>
        <div class="dots-container">
          <span class="dot" onclick="setCurrentSlide(0)"></span>
          <span class="dot" onclick="setCurrentSlide(1)"></span>
          <span class="dot" onclick="setCurrentSlide(2)"></span>
        </div>
      </div>
  </div>

</body>
</html>
